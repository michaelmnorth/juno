# How often Juno may reach out unprompted. Confirmed by Michael 2026-11-07 unless marked (assumed).
timezone: America/New_York
quiet_hours:            # no pings at all; Michael is asleep (Michael)
  start: "22:00"
  end: "06:00"
anchors:                # scheduled touchpoints; these do not count against the budget
  morning_brief: "07:00"
  evening_checkin: "20:30"
  sweep_every_minutes: 120
  sweep_window: ["07:00", "21:00"]
  weekly_reflection: "Sun 18:00"
  coach_sheet_nightly: "21:17"           # catch-all sheet sync and coach note (Michael 2026-11-08)
  hevy_check_every_minutes: 30           # stands in for a Hevy webhook; no model unless a session is new (Michael: 10 was too often)
  hevy_check_window: ["06:00", "22:00"]
unprompted_pings_per_day: 5     # hard ceiling, not a target; most days should be fewer (Michael)
# Michael 2026-11-07: a sweep pings only when something is worth his attention. Silence is the default.
# Worth a ping: something today he must leave for on time, something he is looking forward to, a reply-needed
# email, a due reminder, an approval. Not worth a ping: "nothing new", receipts, newsletters.
always_allowed: [leave_by, approval_needed, urgent]
never_ping_individually: [newsletter, receipt, subscription, noise]
